[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pku-disk-cli"
version = "0.3.0"
description = "Agent-friendly CLI for Peking University AnyShare storage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Longhao Cao" }]
dependencies = [
  "requests>=2.31,<3",
  "requests-toolbelt>=1,<2",
  "truststore>=0.10,<1",
]
keywords = ["pku", "anyshare", "cli", "cloud-storage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
test = ["pytest>=8,<9", "responses>=0.25,<1"]

[project.scripts]
pku-disk = "pku_disk.cli:main"

[project.urls]
Repository = "https://github.com/caolonghao/pku-disk-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pku_disk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
